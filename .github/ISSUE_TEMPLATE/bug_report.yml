name: Bug report
description: The card renders wrong, or a control does nothing
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Before filing: hard-reload the browser with the cache cleared. The
        frontend caches resources aggressively, and a stale bundle looks
        exactly like a bug.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true

  - type: input
    id: card-version
    attributes:
      label: Card version
      description: Shown in the browser console at startup, as MINI-HUMIDIFIER-CARD.
      placeholder: v3.1.6
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: |
        Settings -> About. This matters more than it looks: the card renders
        Home Assistant's own frontend elements, and they change between
        releases.
      placeholder: 2026.8.0
    validations:
      required: true

  - type: input
    id: integration
    attributes:
      label: Integration
      description: |
        Which integration provides the entity: Home Assistant's own
        `xiaomi_miio`, syssi's `xiaomi_miio_airpurifier`, `generic_hygrostat`,
        MQTT, Xiaomi MIoT Auto, something else. The same hardware through two
        integrations reports different attributes and answers different
        services, so this decides which `model:` is the right one - and getting
        it wrong looks exactly like a broken card.
      placeholder: xiaomi_miio
    validations:
      required: true

  - type: textarea
    id: card-config
    attributes:
      label: Card configuration
      description: The full YAML of the card. Secrets are not needed here.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: entity-state
    attributes:
      label: Entity state and attributes
      description: |
        Developer tools -> States, pick the entity, and copy everything the
        right-hand panel shows. Most model problems are visible here and
        nowhere else.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: related-entities
    attributes:
      label: Entity ids of the device's other entities
      description: |
        Only if a control is missing or empty. Developer tools -> States, filter
        by the device name, and copy the **ids** rather than the friendly names.
        The bundled presets build these ids out of the humidifier's own
        (`sensor.<entity>_temperature` and the like), and Home Assistant appends
        `_2` at the end for a second device of the same kind - so the two stop
        lining up and the control is quietly not shown. Nothing else this form
        asks for makes that visible.
      render: text

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Any errors in the browser developer tools console.
      render: text

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: For anything about layout, a screenshot is worth more than a description.

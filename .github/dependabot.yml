version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem bump instead of a dozen: the build toolchain is
      # not worth a review round each.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # lit 3 cannot land while @material/mwc-* requires lit ^2: the bundle
      # would carry both majors. Tracked in #148 - remove this when the mwc
      # components are replaced.
      - dependency-name: lit
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

name: Documentation site

# The site is `docs/` rendered, and nothing else (#222). It is built on every
# pull request that touches it - with `--strict`, so a link to a page that does
# not exist fails the run instead of shipping a 404 - and published only from
# master.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/mkdocs_hooks.py'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/mkdocs_hooks.py'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  # For rebuilding the site when nothing in this list changed - a badge, a
  # release, or a theme update.
  workflow_dispatch:

permissions:
  contents: read

# A second push to master while the first is still deploying would race for the
# same Pages deployment. The newer commit is the one worth publishing, but not
# at the cost of cancelling a deploy half way through - hence no
# `cancel-in-progress`.
# Deploys queue behind each other - the newer commit is worth publishing, but
# not at the cost of cancelling a deploy half way through. Pull requests get a
# group of their own per branch and do cancel, because a superseded preview
# build is worth nothing: with one shared group, a second push to a pull
# request evicted the first run while it was still queued.
concurrency:
  group: pages-${{ github.event_name == 'push' && 'master' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict

      - name: No control characters in the site
        # `mkdocs build --strict` cannot see this: U+0001 renders into an href
        # and the link checker accepts it as a valid relative URL, so a stray
        # control byte in a hook sails straight through the build. The one that
        # hit this repository was a literal SOH in README_DOCS_LINK.sub() in
        # mkdocs_hooks.py (see #248). Tabs and newlines are the only control
        # characters that belong in generated HTML, so anything else fails.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = re.compile(r'[\x00-\x08\x0b-\x1f\x7f]')
          offenders = {}
          for path in pathlib.Path('site').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              hits = list(bad.finditer(text))
              if hits:
                  offenders[path] = len(hits)
          if offenders:
              for path, count in offenders.items():
                  print(f'{count}: {path}')
              sys.exit(1)
          PY

      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets to write, and only Pages. The build above stays
    # read-only, which is the same split as the coverage badge in ci.yml.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

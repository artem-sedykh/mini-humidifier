name: Documentation site

# The site is `docs/` rendered, and nothing else (#222). It is built on every
# pull request that touches it - with `--strict`, so a link to a page that does
# not exist fails the run instead of shipping a 404 - and published only from
# master.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/translate_docs.py'
      - 'requirements-docs.txt'
      - 'requirements-translate.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/translate_docs.py'
      - 'requirements-docs.txt'
      - 'requirements-translate.txt'
      - '.github/workflows/docs.yml'
  # For rebuilding the site when nothing in this list changed - a badge, a
  # release, or a theme update.
  workflow_dispatch:

permissions:
  contents: read

# A second push to master while the first is still deploying would race for the
# same Pages deployment. The newer commit is the one worth publishing, but not
# at the cost of cancelling a deploy half way through - hence no
# `cancel-in-progress`.
# Deploys queue behind each other - the newer commit is worth publishing, but
# not at the cost of cancelling a deploy half way through. Pull requests get a
# group of their own per branch and do cancel, because a superseded preview
# build is worth nothing: with one shared group, a second push to a pull
# request evicted the first run while it was still queued.
concurrency:
  group: pages-${{ github.event_name == 'push' && 'master' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt -r requirements-translate.txt

      # The model is ~100 MB and never changes between runs; downloading it on
      # every build would dominate the job.
      - name: Cache the translation model
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-ru-v1

      # Finished translations, keyed on the English pages that produced them:
      # a build that changes one page re-translates that page and reuses the
      # rest. `restore-keys` is what makes a partial hit possible at all.
      - name: Cache the translations
        uses: actions/cache@v5
        with:
          path: .cache/translations
          key: translations-ru-${{ hashFiles('docs/*.md', 'README.md') }}
          restore-keys: translations-ru-

      # Deliberately allowed to fail. A page with no translation falls back to
      # English, so a translator that breaks costs the site its second language
      # and nothing else - which is a much better outcome than a documentation
      # site that stops publishing.
      - name: Translate
        continue-on-error: true
        run: python scripts/translate_docs.py --lang ru

      # What the translator actually produced, in the run summary. A machine
      # translation that quietly degrades - a model change, a placeholder that
      # stops surviving the round trip - looks exactly like a successful build
      # otherwise.
      - name: Translation sample
        if: always()
        run: |
          page=docs/configuration.ru.md
          {
            echo '### Russian translation sample'
            echo
            if [ -f "$page" ]; then
              echo '```markdown'
              sed -n '1,24p' "$page"
              echo '```'
            else
              echo 'No translation was produced - the site falls back to English.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: mkdocs build --strict

      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets to write, and only Pages. The build above stays
    # read-only, which is the same split as the coverage badge in ci.yml.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

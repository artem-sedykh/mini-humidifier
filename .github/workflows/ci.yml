name: Continuous Integration

on:
  push:
    # `!badges` is belt and braces. That branch holds one JSON file written by
    # the badge job below, and a run of this workflow against it would fail at
    # `npm ci`. A push made with GITHUB_TOKEN does not trigger workflows in the
    # first place - GitHub blocks that to stop them recursing - so today the
    # exclusion changes nothing; it is here so the badge does not start posting
    # red runs if that ever changes.
    branches: ['*', '!badges']
  pull_request:
    # `**`, not `*`: the single star stops at a slash, so a pull request whose
    # base is a branch like `refactor/typescript-models` - which is how one step
    # of a migration is reviewed on top of the one before it - matched nothing
    # and ran no checks at all. The push trigger keeps `*` deliberately: it is
    # there for master, and matching every branch would run everything twice
    # for every pull request.
    branches: ['**']
  # Nothing in this repository changes on its own - but everything it is built
  # against does: browser releases, transitive dependencies, the runner image.
  # A weekly run on master finds a break nobody caused before an outside
  # contributor runs into it on their own pull request and assumes it is theirs.
  #
  # Monday morning UTC, and deliberately not on the hour: GitHub queues
  # scheduled runs across every repository at once, and a job asking for a
  # popular minute waits longer for it.
  #
  # Worth knowing: GitHub disables scheduled workflows in a repository with no
  # activity for 60 days, and emails the owner when it does. A quiet stretch
  # therefore turns this off rather than failing loudly.
  schedule:
    - cron: '17 6 * * 1'
  # So the same run can be triggered by hand when something outside is
  # suspected - a browser release, a Home Assistant frontend change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This name is the required status check on master, so it is not free to
    # change: renaming the job renames the check, and the name the protection
    # rule still expects then sits "expected, waiting for status to be
    # reported" forever, blocking every pull request. To rename it, update the
    # required check first - the pull request that carries the rename is then
    # the first to report under the new name, and merges on its own.
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # esbuild strips the types and checks none of them, so this is the only
        # thing that reads them. It is a step of its own rather than part of
        # another one: a type error and a lint error are different failures and
        # should not have to be told apart by reading a log.
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Documentation paths
        # Cheap, and it needs neither a build nor a browser, so it fails early:
        # every path the documentation names has to exist. Paths in AGENTS.md
        # ended in `.js` for the whole of the TypeScript migration and nothing
        # noticed.
        run: npm run check:docs

      - name: Documentation options
        # The other half of the check above: that one asks whether a file
        # exists, this one whether an option does, and whether anybody says so.
        # It also holds the three lists that describe the card's options -
        # RawCardConfig, CARD_OPTIONS and the table - against each other, which
        # until now was a comment asking for it.
        run: npm run check:options

      - name: The presets' entity names still match the integration
        # Against a snapshot of home-assistant/core, so it needs no network:
        # the presets build entity ids out of names the xiaomi_miio integration
        # chose, and when one is renamed the card quietly draws a hole where an
        # indicator was. `integration-drift.yml` is what refreshes the
        # snapshot; this is what fails when a preset and the snapshot disagree.
        run: npm run check:models

      - name: The README names the version this repository is at
        # `?v=` in the install instructions is the only cache-buster a person
        # has, and it said 3.1.5 while this was at 3.5.2.
        run: npm run check:version

      - name: Changelog
        # CHANGELOG.md is generated from release_notes/. Without this it drifts
        # the first time a release note is edited after the fact, and nobody
        # notices until someone reads the wrong one.
        run: npm run changelog -- --check

      - name: Unit tests
        # With coverage: the thresholds in vitest.config.mjs fail the run if it
        # slides, and coverage/coverage-summary.json is what the badge job
        # below turns into the README badge. `npm test` stays the plain run,
        # because that is the one people wait for locally.
        run: npm run test:coverage

      - name: Coverage summary
        # In the job summary rather than only in the log, which is where a
        # number nobody scrolls to goes to be ignored.
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          {
            echo '### Coverage'
            echo ''
            echo 'The unit layer only - see `coverage.exclude` in vitest.config.mjs.'
            echo ''
            echo '| | % | covered |'
            echo '|---|---|---|'
            node -e '
              const total = require("./coverage/coverage-summary.json").total;
              for (const key of ["statements", "branches", "functions", "lines"]) {
                const m = total[key];
                console.log(`| ${key} | ${m.pct}% | ${m.covered}/${m.total} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Browsers
        # The component tests need these, and the runner image's own Chrome is
        # whatever the image happens to carry that week. Playwright pins both to
        # the versions in the lockfile, so a failure here is the card's.
        #
        # WebKit as well as Chromium since #180: Home Assistant's iOS companion
        # app renders in WKWebView, and until then nothing had ever run this
        # card in a second engine.
        run: npx playwright install --with-deps chromium webkit

      - name: Component tests
        run: npm run test:browser

      - name: Build
        run: npm run rollup

      - name: Bundle assertions
        # Everything that has gone wrong in this repository so far went wrong in
        # the build rather than in the source - a development build of lit, a
        # duplicated dependency, a directive left unresolved - and all of it is
        # visible in the output file. See scripts/check-bundle.mjs.
        run: npm run check:bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: mini-humidifier-bundle
          path: dist/mini-humidifier-bundle.js
          if-no-files-found: error

      - name: Upload the coverage summary
        # Only what the badge job needs, and only on the runs that feed it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

  # The README badge. Kept out of the job above so that job keeps its read-only
  # token: this one needs `contents: write` to push, and a pull request run has
  # no business holding that.
  #
  # The number lives in this repository, on a branch of its own, rather than in
  # a third-party service - which would mean an account and a token in the
  # secrets, the same standing credential that was turned down for the release
  # workflow. shields.io renders it and holds nothing.
  badge:
    name: Coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download the coverage summary
        uses: actions/download-artifact@v7
        with:
          name: coverage-summary
          path: coverage

      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage-badge.mjs "$RUNNER_TEMP/coverage.json"

          # An orphan branch built from scratch and force-pushed: one file, one
          # commit, no history to grow. Nothing reads the branch but shields.
          mkdir "$RUNNER_TEMP/badges"
          mv "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/badges/"
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "ci: coverage badge for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges

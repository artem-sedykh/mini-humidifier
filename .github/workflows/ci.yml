name: Continuous Integration

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    # This name is the required status check on master, so it is not free to
    # change: renaming the job renames the check, and the name the protection
    # rule still expects then sits "expected, waiting for status to be
    # reported" forever, blocking every pull request. To rename it, update the
    # required check first - the pull request that carries the rename is then
    # the first to report under the new name, and merges on its own.
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Browser
        # The component tests need one, and the runner image's own Chrome is
        # whatever the image happens to carry that week. Playwright pins it to
        # the version in the lockfile, so a failure here is the card's.
        run: npx playwright install --with-deps chromium

      - name: Component tests
        run: npm run test:browser

      - name: Build
        run: npm run rollup

      - name: Bundle assertions
        # Everything that has gone wrong in this repository so far went wrong in
        # the build rather than in the source - a development build of lit, a
        # duplicated dependency, a directive left unresolved - and all of it is
        # visible in the output file. See scripts/check-bundle.mjs.
        run: npm run check:bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: mini-humidifier-bundle
          path: dist/mini-humidifier-bundle.js
          if-no-files-found: error

name: Continuous Integration

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: |
          npm run rollup
          npm run babel

      - name: Bundle must not be empty
        run: |
          # A broken rollup config can still exit 0 and emit a stub, and the
          # result only shows up as a blank card in the browser.
          test -s dist/mini-humidifier-bundle.js
          grep -q 'mini-humidifier' dist/mini-humidifier-bundle.js

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mini-humidifier-bundle
          path: dist/mini-humidifier-bundle.js
          if-no-files-found: error

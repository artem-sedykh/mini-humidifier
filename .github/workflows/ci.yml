name: Continuous Integration

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run rollup

      - name: Bundle assertions
        # Everything that has gone wrong in this repository so far went wrong in
        # the build rather than in the source - a development build of lit, a
        # duplicated dependency, a directive left unresolved - and all of it is
        # visible in the output file. See scripts/check-bundle.mjs.
        run: npm run check:bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: mini-humidifier-bundle
          path: dist/mini-humidifier-bundle.js
          if-no-files-found: error

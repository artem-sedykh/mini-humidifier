name: Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  cd:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Version in package.json must match the tag
        run: |
          # The tag is what HACS shows; package.json feeds the README badge.
          # If they drift, the badge advertises a version nobody can install.
          pkg=$(node -p "require('./package.json').version.replace(/^v/, '')")
          if [ "$pkg" != "$RELEASE_VERSION" ]; then
            echo "package.json says $pkg, tag says $RELEASE_VERSION"
            exit 1
          fi

      - name: Lint and build
        run: |
          npm run lint
          npm run rollup
          npm run babel

      - name: Set the release body
        id: release
        run: |
          notes="release_notes/v${RELEASE_VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing $notes - add the release notes before tagging."
            exit 1
          fi
          # Heredoc into $GITHUB_OUTPUT. The old ::set-output command with %0A
          # escaping is deprecated and mangles multiline markdown.
          {
            echo 'RELEASE_BODY<<RELEASE_NOTES_EOF'
            cat "$notes"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release file
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/*
          file_glob: true
          overwrite: true
          promote: true
          body: ${{ steps.release.outputs.RELEASE_BODY }}

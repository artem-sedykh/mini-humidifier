# The documentation site, built from the same `docs/` the repository has always
# carried (#222). Nothing content-bearing lives here: this file only says how
# those files are rendered, which is the whole difference between a site and a
# wiki - a wiki would have been a second copy to keep level with the first.
#
# Build it locally with `pip install -r requirements-docs.txt` and then
# `mkdocs serve`. CI builds it with `--strict`, so a link to a page that does
# not exist fails the run rather than shipping a 404.
site_name: Mini Humidifier Card
site_description: A minimalistic yet customizable humidifier card for the Home Assistant Lovelace UI.
site_url: https://artem-sedykh.github.io/mini-humidifier/
site_author: artem-sedykh

repo_url: https://github.com/artem-sedykh/mini-humidifier
repo_name: artem-sedykh/mini-humidifier
edit_uri: edit/master/docs/

copyright: MIT

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    # The card is configured by copying YAML, so the copy button is not a
    # decoration here.
    - content.code.copy
    - content.action.edit
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Follows the reader's system setting first, and can be overridden from the
    # header - the same way the Home Assistant frontend behaves.
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/artem-sedykh/mini-humidifier
      name: The repository
  # Rendered in the announcement bar by overrides/main.html. The site is built
  # from master, and what a reader has installed came from HACS, so the two can
  # disagree - saying so is cheaper than versioning the site.
  releases_url: https://github.com/artem-sedykh/mini-humidifier/releases/latest
  changelog_url: https://github.com/artem-sedykh/mini-humidifier/blob/master/CHANGELOG.md

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Models: models.md
  - A device with no preset: custom-device.md
  - Controls: controls.md
  - Indicators: indicators.md
  - Buttons: buttons.md
  - Examples: examples.md
  - Development: development.md
